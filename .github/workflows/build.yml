name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libgl1-mesa-dri xvfb xauth
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke-test the OpenGL renderer
        if: runner.os == 'Linux'
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 MESA_GLSL_VERSION_OVERRIDE=330
          xvfb-run -a -s "-screen 0 1600x900x24" ./build/westernsim --screenshot /tmp/campus.ppm
          xvfb-run -a -s "-screen 0 1600x900x24" ./build/westernsim --screenshot-map /tmp/map.ppm
          xvfb-run -a -s "-screen 0 1600x900x24" ./build/westernsim --screenshot-avatar /tmp/avatar.ppm
          test -s /tmp/campus.ppm && test -s /tmp/map.ppm && test -s /tmp/avatar.ppm
